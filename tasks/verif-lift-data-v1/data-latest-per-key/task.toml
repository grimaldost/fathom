id = "data-latest-per-key"
instruction = """
`dedupe.latest.latest_per_key` keeps the FIRST row when two rows share the
greatest `ts`, but the README says the last one in input order wins. Make ties
resolve the documented way; the strictly-greater case already behaves.
"""

[limits]
trial_timeout_s = 900
max_turns = 45

[gate]
run = "python -m unittest discover -s tests -t . -q"

[verify]
entry = "verify.py"
timeout_s = 180
