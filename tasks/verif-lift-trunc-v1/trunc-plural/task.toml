id = "trunc-plural"
instruction = """
A defect in `phrasing/plural.py` shows up as a summary line reads '0 item'; the reported
symptom points at `phrasing/plural.py:1-24`. The package README states the
rule this module is meant to follow. Bring the module into line with it.
"""

[limits]
trial_timeout_s = 900
max_turns = 45

[gate]
run = "python -m unittest discover -s tests -t . -q"

[verify]
entry = "verify.py"
timeout_s = 180
