id = "trunc-escape-cell"
instruction = """
A defect in `tablerender/escape.py` shows up as a value containing a pipe splits into two columns; the reported
symptom points at `tablerender/escape.py:1-19`. The package README states the
rule this module is meant to follow. Bring the module into line with it.
"""

[limits]
trial_timeout_s = 900
max_turns = 45

[gate]
run = "python -m unittest discover -s tests -t . -q"

[verify]
entry = "verify.py"
timeout_s = 180
