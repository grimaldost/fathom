id = "trunc-sort-key"
instruction = """
A defect in `ordering/sortkeys.py` shows up as 'Beta' sorts before 'alpha' in the listing; the reported
symptom points at `ordering/sortkeys.py:1-20`. The package README states the
rule this module is meant to follow. Bring the module into line with it.
"""

[limits]
trial_timeout_s = 900
max_turns = 45

[gate]
run = "python -m unittest discover -s tests -t . -q"

[verify]
entry = "verify.py"
timeout_s = 180
