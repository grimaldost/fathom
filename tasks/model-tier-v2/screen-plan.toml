# The admission screen (design Part B), scoped to EVERY rung the matrix can buy.
#
# WHY THIS FILE EXISTS. The first pre-registration ran the screen on four of nine rungs
# — the mid band — and let the other five into the matrix on authoring evidence alone.
# That is the weakest place to trust authoring: every rung's hard criteria are stated as
# verbatim bullets in the fixture README, and the task instruction points the model at
# that README, so the discovery step the displaced-cause shape is meant to gate on is
# partly handed over. Whether a real weak model writes the `counter/` patch or reads the
# contract and writes the `solution/` one is not a question authoring can answer at any
# price. Keeping the scope in prose is how it drifted; keeping it here makes it a test
# (tests/test_bank_model_tier_v2.py::TestPreRegistration).
#
# THE RULE THE SCOPE ENFORCES: a rung enters the matrix only after it passes its screen.
# The sealed holdout is therefore NOT screened and NOT buyable — `--include-holdout` is
# out of bounds for this bank until fix-quota-rollup has a screen of its own.
#
# The screen is not an extra purchase: its arms resolve to the matrix arms' own
# config_hash, so every screen trial is a matrix trial the matrix will resume over.

schema_version = "1"

arms = ["haiku", "opus5"]
repeats = 5
scenarios_dir = "scenarios/model-tier-v2-screen"
max_budget_usd = 2      # PER-SPAWN cap, not a run total; the run total is watched cumulatively

# ---------------------------------------------------------------- decision rule
#
# Fixed before the spend, and read off PER-TRIAL pass counts (all hard criteria true in
# one trial = one draw; ADR-0009). At repeats=5 each arm contributes a 0..5 count.
#
#   SATURATED  haiku passes 5/5  -> the weak tier already does the task, so it carries
#                                   no information about a boundary. DROP.
#   FLOORED    opus5 passes 0/5  -> no tier on the ladder does the task, so it measures
#                                   the instrument's ceiling, not a cut. DROP.
#   ADMITTED   otherwise         -> the rung enters the matrix.
#
# SEPARATING is an informational label on top of ADMITTED, not an admission bar: a
# one-sided Fisher exact test of haiku < opus5 at p <= 0.05, which at repeats=5 needs
# haiku <= 1/5 against opus5 5/5. Requiring it for admission would demand of a single
# rung, at n=5, the evidence the whole matrix is bought to produce.
#
# If EVERY rung in a band drops, that band is empty and no cut through it is testable;
# if every rung drops, the matrix is not bought at all.

[rule]
saturated_when = "weak arm passes every repeat"
floored_when = "strong arm passes no repeat"
admitted_otherwise = true
separating_label = "one-sided Fisher exact p <= 0.05 on per-trial pass counts"
separating_alpha = 0.05

# ---------------------------------------------------------------- blocks
#
# Block A is the gap the review found: the rungs the first plan let through unscreened.
# It is bought FIRST because it is the block carrying an unmeasured assumption, and
# because the weak and strong bands are where a dropped rung changes the matrix most.
#
# Block B is the original stage 0, unchanged in scope, arms, repeats and decision rule.

[blocks.a-previously-unscreened]
tasks = ["fix-clamp2", "fix-graph-cycle", "fix-merge-3way", "fix-ledger-replay"]
trials = 40
bands = "weak (1 rung) + strong (3 rungs)"
note = "the rungs the first pre-registration admitted on authoring evidence alone"

[blocks.b-mid-band]
tasks = ["feature-ndjson-merge", "fix-strip-unicode", "fix-tz-window", "fix-decimal-round"]
trials = 40
bands = "mid (4 rungs)"
note = "the original stage 0; both the 25 and the 55 cut rest on these rungs"

# ---------------------------------------------------------------- exclusions

[exclusions]
"fix-quota-rollup" = "sealed holdout (ADR-0005): not screened, therefore not buyable"
"control-nonlocal-parse" = "positive control, not a ladder rung; read by its own rule at repeats=10"
