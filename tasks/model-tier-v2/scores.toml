# Per-task complexity scores for the calibration confusion matrix.
#
# RATING STATUS: **author-only, one rater**. The design's acceptance criteria ask for
# two blind raters, as model-tier-v1 had. The bank was authored in a single
# non-interactive session with no way to convene a second, blind rater, so the second
# rating is an OPEN pre-run step, not a completed one. The per-axis breakdown below is
# recorded in full precisely so a second rater can check the arithmetic rather than
# re-derive it, and so a disagreement lands on a named axis. Until that rating exists,
# every band claim in README.md is provisional.
#
# Rubric: the pinned model-complexity rubric shipped at
# `choosing-models/references/scoring-rubric.md` (the same rubric model-tier-v1 used,
# kept pinned for cross-study continuity). Base 30 for anything with logic; the
# cross-shape floor raises a sub-26 score to 26 but never lowers one.
#
# Predicted tier = tier_for_score(score): 0-25 weak / 26-55 mid / 56-100 strong.

[scores]
fix-clamp2 = 20
fix-strip-unicode = 40
feature-ndjson-merge = 38
fix-tz-window = 50
fix-decimal-round = 54
fix-quota-rollup = 60
fix-graph-cycle = 62
fix-merge-3way = 67
fix-ledger-replay = 71

# Per-axis breakdown, for the second rater. Keys are the rubric's own axes:
# base + structure + reasoning + domain + context + output + adjustments.
# `cross_shape` records whether the cross-shape floor fired (it never lowers a score).

[breakdown.fix-clamp2]
base = 30
structure = 0
reasoning = 0
domain = 0
context = 0
output = 0
adjustments = -10
cross_shape = false
note = "the high bound already works; the fix mirrors an existing branch — copy/paste reasoning, mechanical verification and clear acceptance both discount"

