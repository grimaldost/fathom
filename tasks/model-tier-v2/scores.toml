# =================================================================================
# THE ANALYSIS PARAMETERS, FIXED BEFORE THE SPEND.
#
# `tau` is the adequacy bar: a tier is adequate for a task when its per-trial pass
# rate is at least tau. 0.7 is chosen against measured accuracy, not taste — see
# README § *Why the rung statistic changed*: over six realistic rungs, the absolute
# bar at 0.7 reads the right tier 88% of the time at repeats=5 and 96% at repeats=10,
# where the as-built relative statistic reads it 33% and 63%. At repeats=5 the bar is
# "4 of 5 or better".
#
# `non_inferiority_margin` is the quality side of the constraint: a cheaper mechanism
# wins only if its mean quality is within this of the best mechanism's.
#
# `escalation_cost_multiplier` prices the retry term: a gate-caught failure is assumed
# to buy the failing tier's spend AND the next tier up. A silent failure buys the
# failing tier's spend and an escape, which the quality constraint handles rather than
# the cost model — the two are reported separately and never summed.
[analysis]
tau = 0.7
tau_sensitivity = [0.6, 0.7, 0.8]
non_inferiority_margin = 0.05
alpha = 0.05
escalation_cost_multiplier = 1.0

# The positive control, declared machine-readably so calibration.py reads it by its own
# rule and keeps it out of the confusion matrix. The rule is a one-sided Fisher exact
# test between `weak_arm` and `strong_arm` on PER-TRIAL pass counts (all hard criteria
# true): the control separates iff p <= alpha at >= min_repeats repeats per arm.
#
# WHY min_repeats = 10. Costed by exact enumeration at the control's own recorded v1
# rates (haiku 0.4, opus5 1.0) under per-trial scoring — see docs/adr/0009. The rule
# this replaces (haiku's Wilson CI disjoint from opus5's) reproduces with probability
# 0.078 at repeats=5 and needs repeats=15 to clear 0.9. The Fisher rule reaches 0.945
# at repeats=10, which is the cheapest point that clears the 0.9 bar.
#
# HONEST LIMIT, RECORDED. 0.945 is computed with opus5 plugged in at the 5/5 point
# estimate. If opus5's true rate is 0.9, repeats=10 gives 0.659 and 20 repeats are
# needed for 0.951. The pre-registration buys 10 because that is the bar the reviewer
# set (">= 0.9 at v1's own observed rates"); a control that fails at 10 therefore
# blocks the tier conclusions without proving the ladder flat, which is the
# conservative direction and is stated as such in README.md.
[control]
task = "control-nonlocal-parse"
weak_arm = "haiku"
strong_arm = "opus5"
alpha = 0.05
min_repeats = 10

# Provenance of the control's score and its prior reading — the evidence that makes it
# a usable positive control. Observed on ledger/model-tier-v1.jsonl at --repeats 5,
# both hard criteria passing: haiku 2/5, sonnet 3/5, sonnet5 4/5, opus 5/5, opus5 5/5.
[control_provenance.control-nonlocal-parse]
bank = "model-tier-v1"
task_id = "fix-nonlocal-parse"
score_author = 70
score_blind_rater = 61
score_final = 65
observed_hard_pass_haiku = "2/5"
observed_hard_pass_sonnet = "3/5"
observed_hard_pass_sonnet5 = "4/5"
observed_hard_pass_opus = "5/5"
observed_hard_pass_opus5 = "5/5"
