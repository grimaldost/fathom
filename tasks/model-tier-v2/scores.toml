# =================================================================================
# THE REDUCED MECHANISM, DECLARED PER TASK AND FROZEN BEFORE ANY SPEND.
#
# The decision this bank feeds is not "is the rubric accurate" but "which routing
# MECHANISM costs least at equal quality". Two of the candidate mechanisms are
# authored here because they are properties of the TASK, not of a run:
#
#   points  — tier_for_score(score), the scored rubric as it ships.
#   reduced — the floor plus a few shape shortcuts: the cross-shape floor fires -> mid;
#             else a shortcut from the rubric's OWN published "Likely strong" list
#             fires -> strong; else weak.
#
# `shortcut` names the entry from that list, verbatim, or is empty. Taking the list
# from the rubric rather than inventing one is what keeps the reduced mechanism from
# being a straw man: it is the rubric's own advice with the arithmetic removed.
#
# A rung is DISCORDANT when the two mechanisms route it differently. Those rungs, and
# only those, are where C(points) and C(reduced) can differ, so they are what tranche 1
# buys. The other mechanisms under test (always-weak-with-escalation, a fixed single
# tier, no mechanism) differ from both on EVERY rung and need the full census.

[reduced.fix-clamp2]
floor_fires = false
shortcut = ""
prediction = "weak"

[reduced.fix-strip-unicode]
floor_fires = false
shortcut = ""
prediction = "weak"

[reduced.feature-ndjson-merge]
floor_fires = true
shortcut = ""
prediction = "mid"

[reduced.fix-tz-window]
floor_fires = true
shortcut = ""
prediction = "mid"

[reduced.fix-decimal-round]
floor_fires = true
shortcut = "regulatory / compliance"
prediction = "strong"

[reduced.fix-quota-rollup]
floor_fires = true
shortcut = ""
prediction = "mid"

[reduced.fix-graph-cycle]
floor_fires = true
shortcut = ""
prediction = "mid"

[reduced.fix-merge-3way]
floor_fires = true
shortcut = "novel algorithm"
prediction = "strong"

[reduced.fix-ledger-replay]
floor_fires = true
shortcut = "regulatory / compliance"
prediction = "strong"

[reduced.refactor-dedupe-validators]
floor_fires = false
shortcut = ""
prediction = "weak"

[reduced.debug-cache-staleness]
floor_fires = true
shortcut = ""
prediction = "mid"

[reduced.data-reconcile-telemetry]
