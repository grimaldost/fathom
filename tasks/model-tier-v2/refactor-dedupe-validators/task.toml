id = "refactor-dedupe-validators"
instruction = """
The `forms` package carries three near-identical copies of the same address rules,
one in each of `forms/signup.py`, `forms/profile.py` and `forms/invite.py`. They have
drifted apart: each copy enforces a different subset of the rules written down in
`RULES.md`.

Remove the duplication. Put one implementation of the rules in `forms/common.py` as
`check_email(email)`, have all three of `validate_signup`, `validate_profile` and
`validate_invite` call it, and make every form agree with `RULES.md` — the same
answer for the same address, on the valid and invalid examples RULES.md lists and on
anything else the four rules cover.

Those four files are the only ones to change. Keep the three public function names and
their signatures, and keep the shipped test suite passing.
"""

[limits]
trial_timeout_s = 1500
max_turns = 90

[verify]
entry = "verify.py"
timeout_s = 180
# Derived, not chosen — see ../oracles.toml § HOW `hard_criteria` IS DERIVED: false on
# the untouched fixture, false on counter/, true on solution/. `plus_addressing_kept`
# and `invite_stays_case_insensitive` are TRUE on the untouched source (they are
# regression guards over behaviour that already holds), so neither is admissible; they
# remain in the standard oracle and still gate the exit code.
hard_criteria = [
    "converged_rules_all_three",
    "all_three_delegate_to_common",
    "rules_match_the_document_exactly",
]

[gate]
# The shipped suite, green on the untouched fixture: it covers only the cases the three
# copies already agree on, never the rules they drifted apart on.
run = "python -m unittest discover -s tests -t ."
