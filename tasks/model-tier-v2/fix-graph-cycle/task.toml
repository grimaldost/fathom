id = "fix-graph-cycle"
instruction = """
Users of the `deps` package report that `traverse.topo_order` raises `CycleError`
on a graph that has no cycle. It happens when a build file lists the same
dependency twice — `add_edge(graph, "app", "lib")` called twice, then
`add_edge(graph, "lib", "core")`. Find and fix the bug so the package behaves as
documented in the package README. Preserve the existing public API, and keep the
shipped test suite passing.
"""

[limits]
trial_timeout_s = 1500
max_turns = 120

[verify]
entry = "verify.py"
timeout_s = 180
# Derived — see ../oracles.toml § HOW `hard_criteria` IS DERIVED. `real_cycle_still_raises`
# is dropped: it is TRUE on the untouched buggy source, so it is a regression guard rather
# than a capability check (it stays in the standard oracle and still gates the exit code).
# Third is strong-level.
hard_criteria = [
    "dependency_count_deduplicated",
    "tree_lists_each_dependency_once",
    "neighbours_lists_each_dependency_once",
]

[gate]
# The shipped suite, run from the workspace root. Green on the untouched fixture by
# construction (the suite does not cover the planted bug), so a gated strategy would
# see a truthful baseline. This bank's own arms are single-session and never run it;
# it is here so the gate property is VERIFIABLE rather than unverifiable, and it names
# only paths that exist in the staged workspace — no placeholder ever reaches a shell.
run = "python -m unittest discover -s tests -t ."
