name = "control2-sonnet"
# Arm control2 (control, iteration 2) — multiagent dispatch alone, tier-set sonnet.
#
# Tier-set sonnet: implementer subagents run on claude-sonnet-5 — what the
# choosing-models rubric assigns to all five PRs and the tier the operator actually
# dispatches.
#
# Identical to control2-haiku except FATHOM_IMPL_MODEL; see control2-haiku.toml for what
# iteration 2 changes against iteration 1 and what the eight arms share.
#
# Differs from control2: nothing — this IS control2 (tier-set sonnet).
adapter = "claude-cli"
model = "claude-sonnet-5"
strategy = "single-session"
effort = "high"

[tools]
source = "none"
allowed = ["Read", "Write", "Edit", "Glob", "Grep", "Task", "Bash(python:*)"]
registry = "allowed"

[context]
inject = "assets/brief-control2.md"

[env]
CONVOY_GATE_DRIVER = "${FATHOM_TASK_DIR}/run_convoy_gate.py"
FATHOM_CONVOY_PIN = "git+https://github.com/grimaldost/convoy@v0.12.0"
FATHOM_IMPL_MODEL = "claude-sonnet-5"
FATHOM_PLACEBO_GATE = "${FATHOM_TASK_DIR}/placebo_gate2.py"
FATHOM_PROMPTS_DIR = "${FATHOM_PROMPTS_DIR}"
FATHOM_TASK_DIR = "${FATHOM_TASK_DIR}"

[limits]
trial_timeout_s = 5400
