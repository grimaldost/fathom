name = "placebo-sonnet"
# Arm P (placebo) — the extra iteration, with no independent information, tier-set sonnet.
#
# Tier-set sonnet: implementer subagents run on claude-sonnet-5 — what the
# choosing-models rubric assigns to all five PRs and the tier the operator actually
# dispatches. The corpus predicts saturation here, which is itself a pre-registered
# prediction.
#
# Identical to control except that after each PR the orchestrator also runs
# `placebo_gate.py`, which reds exactly once per workspace with a message naming no check,
# no expression and no rule, then greens. It buys the same extra round of verify-and-fix a
# real gate's red forces, and nothing else. If a convoy-gate arm beats control by no more
# than this one does, the gate's value was the iteration, not the information.
#
# Differs from control: the after-each-PR paragraph of the injected brief adds the placebo
# gate run. Same brief otherwise, byte for byte.
#
# Shared by all eight arms of this bank and byte-identical in each: orchestrator model
# (claude-sonnet-5) and effort, the tool allow-list, `trial_timeout_s`, and the five
# `[env]` keys. `${FATHOM_TASK_DIR}` and `${FATHOM_PROMPTS_DIR}` are TEMPLATES — they
# enter config_hash unresolved and are substituted from the invoking shell's environment
# at spawn time, so the arm's identity does not move when the checkout does. Export
# FATHOM_TASK_DIR to tasks/multiagent-composition-v2/exprlang and FATHOM_PROMPTS_DIR to
# that directory's `prompts/` before running.
#
# FATHOM_PROMPTS_DIR is what v2 adds. The briefs point the orchestrator at it, and it
# holds the five PR prompts and nothing else, so no arm's orchestrator has a brief-given
# path to the task dir — which also holds the driver, the probes, the placebo and
# series.toml. In the v1 pilot two non-treatment orchestrators saw the driver's filename
# through that path; neither executed it, but the arm structure was visible where it
# should not have been.
#
# The brief's CONTENT is hashed, not its path: editing a brief forks longitudinal
# history, and per the pre-registration any edit to a brief, the driver, the probes, the
# placebo or verify.py bumps the affected arm names. The scripts a command or an [env]
# value points at are NOT hashed — that is why the rule is a naming rule.
adapter = "claude-cli"
model = "claude-sonnet-5"
strategy = "single-session"
effort = "high"

[tools]
source = "none"
allowed = ["Read", "Write", "Edit", "Glob", "Grep", "Task", "Bash(python:*)"]

[context]
inject = "assets/brief-placebo.md"

[env]
CONVOY_GATE_DRIVER = "${FATHOM_TASK_DIR}/run_convoy_gate.py"
FATHOM_IMPL_MODEL = "claude-sonnet-5"
FATHOM_PLACEBO_GATE = "${FATHOM_TASK_DIR}/placebo_gate.py"
FATHOM_PROMPTS_DIR = "${FATHOM_PROMPTS_DIR}"
FATHOM_TASK_DIR = "${FATHOM_TASK_DIR}"

[limits]
trial_timeout_s = 5400
