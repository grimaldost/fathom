name = "final-sonnet"
# Arm T-final (treatment) — convoy's gate once at the end, harness-driven, tier-set sonnet.
#
# Tier-set sonnet: implementer subagents run on claude-sonnet-5 — what the
# choosing-models rubric assigns to all five PRs and the tier the operator actually
# dispatches. The corpus predicts saturation here, which is itself a pre-registered
# prediction.
#
# The control BRIEF, unchanged: the orchestrator is told nothing about a gate and behaves
# exactly as in arm C. The difference is outside the agent's brief entirely — the harness
# runs the task's visible suite and then the convoy gate driver once after the session
# (`gated-session` + `[gate].extra`, unscoped so the whole gate runs), and re-prompts the
# session with the gate output under the executor's bounded fix loop.
#
# Differs from control: the strategy is `gated-session` and `[gate].extra` runs the driver
# after the session. The injected brief is control's, byte for byte.
#
# Shared by all eight arms of this bank and byte-identical in each: orchestrator model
# (claude-sonnet-5) and effort, the tool allow-list, `trial_timeout_s`, and the four
# `[env]` keys. `${FATHOM_TASK_DIR}` is a TEMPLATE — it enters config_hash unresolved and
# is substituted from the invoking shell's environment at spawn time, so the arm's
# identity does not move when the checkout does. Export FATHOM_TASK_DIR to
# tasks/multiagent-composition/exprlang before running.
#
# The brief's CONTENT is hashed, not its path: editing a brief forks longitudinal
# history, and per the pre-registration any edit to a brief, the driver, the probes, the
# placebo or verify.py bumps the affected arm names. The scripts a command or an [env]
# value points at are NOT hashed — that is why the rule is a naming rule.
adapter = "claude-cli"
model = "claude-sonnet-5"
strategy = "gated-session"
effort = "high"

[tools]
source = "none"
allowed = ["Read", "Write", "Edit", "Glob", "Grep", "Task", "Bash(python:*)"]

[context]
inject = "assets/brief-control.md"

[env]
CONVOY_GATE_DRIVER = "${FATHOM_TASK_DIR}/run_convoy_gate.py"
FATHOM_IMPL_MODEL = "claude-sonnet-5"
FATHOM_PLACEBO_GATE = "${FATHOM_TASK_DIR}/placebo_gate.py"
FATHOM_TASK_DIR = "${FATHOM_TASK_DIR}"

[gate]
extra = ['python "${task_dir}/run_convoy_gate.py" "${task_dir}" "${workspace}"']

[limits]
trial_timeout_s = 5400
