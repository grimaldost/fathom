name = "perpr-haiku"
# Arm T-perPR (treatment) — convoy's gate between PRs, agent-driven, tier-set haiku.
#
# Tier-set haiku: implementer subagents run on claude-haiku-4-5 — the regime with
# measured headroom, where the pre-registration predicts the treatment effect lives.
#
# Identical to control except that after each PR the orchestrator also runs the convoy
# gate driver scoped to that PR's phase tag, and on a `blocked` envelope dispatches a fix
# subagent with the envelope's `repair_brief` verbatim, re-running until `completed`. The
# gate's checks are the decomposition's own [[checks]] plus two independent type-contract
# probes whose assets live outside the workspace. The agent drives the loop; the harness
# does not.
#
# Differs from control: the after-each-PR paragraph of the injected brief adds the convoy
# gate loop. Same brief otherwise, byte for byte.
#
# Shared by all eight arms of this bank and byte-identical in each: orchestrator model
# (claude-sonnet-5) and effort, the tool allow-list, `trial_timeout_s`, and the four
# `[env]` keys. `${FATHOM_TASK_DIR}` is a TEMPLATE — it enters config_hash unresolved and
# is substituted from the invoking shell's environment at spawn time, so the arm's
# identity does not move when the checkout does. Export FATHOM_TASK_DIR to
# tasks/multiagent-composition/exprlang before running.
#
# The brief's CONTENT is hashed, not its path: editing a brief forks longitudinal
# history, and per the pre-registration any edit to a brief, the driver, the probes, the
# placebo or verify.py bumps the affected arm names. The scripts a command or an [env]
# value points at are NOT hashed — that is why the rule is a naming rule.
adapter = "claude-cli"
model = "claude-sonnet-5"
strategy = "single-session"
effort = "high"

[tools]
source = "none"
allowed = ["Read", "Write", "Edit", "Glob", "Grep", "Task", "Bash(python:*)"]

[context]
inject = "assets/brief-treatment-perpr.md"

[env]
CONVOY_GATE_DRIVER = "${FATHOM_TASK_DIR}/run_convoy_gate.py"
FATHOM_IMPL_MODEL = "claude-haiku-4-5"
FATHOM_PLACEBO_GATE = "${FATHOM_TASK_DIR}/placebo_gate.py"
FATHOM_TASK_DIR = "${FATHOM_TASK_DIR}"

[limits]
trial_timeout_s = 5400
