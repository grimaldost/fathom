name = "opus5"
adapter = "claude-cli"
model = "claude-opus-5"
strategy = "single-session"
effort = "high"

# Strong tier, CURRENT model (Opus 5). Added 2026-08-11 to re-measure calibration after the
# strong-tier lineup move Opus 4.8 -> Opus 5. Left the June `opus` arm (Opus 4.8) in place so
# the 4.8->5 delta is visible side-by-side. Identical to haiku/sonnet/sonnet5/opus except
# `model`, so the contrast stays the model axis.
[tools]
source = "none"
allowed = ["Read", "Write", "Edit", "Glob", "Grep", "PowerShell", "Bash"]

[limits]
trial_timeout_s = 1800
