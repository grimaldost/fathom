name = "phase3-e1-debug-disc-sub-sonnet"
adapter = "claude-cli"
model = "claude-sonnet-5"
strategy = "single-session"
effort = "medium"

[tools]
source = "none"
allowed = ["Read", "Write", "Edit", "Glob", "Grep", "Bash(python:*)", "Task"]

[plugins]
mount = [
    "C:/Users/grima/Documents/s1/scenarios/phase3-hooks/subagent-gate-multi",
]

[env]
GATE_DISCIPLINE = "debug"
GATE_REGISTER = "discipline"

[limits]
trial_timeout_s = 600

[context]
inject = "../phase2-assets/delegate-subagent.md"
