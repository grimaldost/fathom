name = "screen-c-debug-retrospective-gate-haiku"
adapter = "claude-cli"
model = "claude-haiku-4-5"
strategy = "single-session"
effort = "medium"

[tools]
source = "none"
allowed = ["Read", "Write", "Edit", "Glob", "Grep", "Bash(python:*)", "Skill"]

[plugins]
mount = [
    "C:/Users/grima/Documents/craft-collection/plugins/humblepowers",
    "C:/Users/grima/Documents/craft-collection/plugins/engineering-discipline",
    "C:/Users/grima/Documents/craft-collection/plugins/session-workflow",
    "C:/Users/grima/Documents/s1/scenarios/screen-hooks/retrospective-gate",
]

[env]
HUMBLEPOWERS_DISPATCH_PROMPT_INJECT = "0"
GATE_DISCIPLINE = "systematic-debugging"

[limits]
trial_timeout_s = 600
