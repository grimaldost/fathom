name = "skill-current"
adapter = "claude-cli"
model = "claude-sonnet-5"
strategy = "single-session"
effort = "medium"

# The shipped surface as it stands. Differs from `bare` in exactly one thing:
# the skill body is appended to the spawn's system prompt. Provenance and the
# pinning rule are in README.md beside this file; the asset's content sha256
# enters config_hash, so editing it forks the resume key rather than silently
# changing what was measured.

[tools]
source = "none"
allowed = ["Read", "Write", "Edit", "Glob", "Grep", "Bash(python:*)", "Skill"]

[context]
inject = "assets/skill-current.md"

[limits]
trial_timeout_s = 900
