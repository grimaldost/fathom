# The commit lane — the fast half of CI, run before a commit lands instead of after a push.
# Formatting, lint, a stale committed index and version sites out of step are fast, local
# and deterministic to check, so they are caught here rather than on the default branch.
#
# Every hook checks what its name says whatever the committer's environment holds. In
# particular FATHOM_HOME, which names a data root and wins over the working directory, is
# cleared or overridden by each hook that runs fathom (see the reconcile hooks below).
#
# Install (one-off, per clone):
#     railform arm
# which sets core.hooksPath to .githooks, the same as `git config core.hooksPath .githooks`.
# The railform command is run from the pinned commit, as CONTRIBUTING.md ("Hooks") spells out.
#
# NOT `pre-commit install`: that writes a hook invoking the bare `pre-commit` executable
# shim, and in environments where the console-script shim is blocked the hook silently
# never runs. The tracked hooks in .githooks/ call this config through
# `uv run --frozen python -m pre_commit`, pinned by uv.lock.
#
# The entries between the railform markers are owned by `railform adopt`: the commit message
# rules (conventional subjects, no AI attribution, the types and patterns of railform's frame),
# the branch name rail, the hook wrapper check, the private reference check and the hygiene
# hooks. The hooks below are this repository's own.
#
# ruff runs as a local `language: system` hook so the version is uv.lock's, never a second
# pinned copy drifting from CI. pytest stays CI-owned: the suite takes minutes, and the
# commit lane must not. The one exception is a single test that takes about a second and
# runs only when the arm-hashing code or the example data root is staged.

# Files no hook touches. The SVG artwork in assets/ has no final newline, and the truncated
# stream fixture is cut mid-line on purpose (tests/test_adapter_claude_cli.py reads it as a
# stream that ended early); the end-of-file hygiene hook would "fix" both.
exclude: ^(assets/[^/]+\.svg|tests/fixtures/stream_truncated\.jsonl)$

repos:
  # >>> railform: owned by `railform adopt`; `railform adopt --check` fails on any edit
  - repo: https://github.com/grimaldost/railform
    rev: 65bf54ae6f4ed7bd027fee9e0806d9dfa2df3c48
    hooks:
      - id: railform-commit-msg
      - id: railform-branch-name
      - id: railform-hooks-check
        files: '^\.githooks/'
      - id: railform-private-refs
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: cef0300fd0fc4d2a87a85fa2093c6b283ea36f4b  # frozen: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: check-merge-conflict
        args: [--assume-in-merge]
        stages: [pre-commit]
      - id: check-added-large-files
        stages: [pre-commit]
      - id: check-yaml
        stages: [pre-commit]
      - id: check-toml
        stages: [pre-commit]
      - id: check-json
        stages: [pre-commit]
  # <<< railform
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format (check)
        entry: uv run ruff format --check .
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: ruff-check
        name: ruff check
        entry: uv run ruff check .
        language: system
        pass_filenames: false
        stages: [pre-commit]

      # `fathom reconcile` at the engine root, with no data root named or found, checks the
      # engine's version sites, so it runs when one of them is staged. A FATHOM_HOME in the
      # committer's environment would name a data root and the hook would check that
      # instead (or fail on a stale path), so the entry clears it: fathom reads an empty
      # FATHOM_HOME as unset. `bash -c` because an inline assignment needs a shell. Git runs
      # hooks with its own bash first on PATH on every platform, Git for Windows included;
      # outside a hook on Windows, `bash` can resolve to WSL's instead, so run pre-commit by
      # hand from Git Bash there.
      - id: reconcile
        name: fathom reconcile (engine version sites)
        entry: bash -c 'FATHOM_HOME= uv run fathom reconcile'
        language: system
        pass_filenames: false
        stages: [pre-commit]
        files: ^(pyproject\.toml|\.claude-plugin/plugin\.json|CHANGELOG\.md)$

      # The example data root, named with --home, which wins over FATHOM_HOME. A header,
      # rendering or counting change in the index code makes its committed index stale, so
      # those modules trigger it too (ledger.py applies voids before the index counts
      # completed trials). CI also reconciles it found from inside, and named by
      # FATHOM_HOME.
      - id: reconcile-example-data-root
        name: fathom reconcile (examples/data-root)
        entry: uv run fathom --home examples/data-root reconcile
        language: system
        pass_filenames: false
        stages: [pre-commit]
        files: ^(examples/data-root/|src/fathom/(reconcile|ledgerindex|ledger)\.py$)

      # The example data root's ledger rows record the config_hash the engine computed for
      # each arm. `fathom reconcile` only re-digests each row's stored preimage, so a change
      # to how an arm is hashed leaves it green; this test resolves the fixture's arms again
      # and compares. (tests/conftest.py clears FATHOM_HOME for every test.)
      - id: example-data-root-hashes
        name: example data root config hashes (one pytest test)
        entry: uv run pytest -q tests/test_reconcile.py -k test_the_fixture_rows_carry_the_hash_the_engine_computes
        language: system
        pass_filenames: false
        stages: [pre-commit]
        files: ^(examples/data-root/(scenarios|ledger)/|src/fathom/scenario\.py$)
