[project]
name = "fathom"
version = "0.4.1"
description = "Scenario-blind tool-effectiveness evals"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
fathom = "fathom.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["ruff", "pytest", "pre-commit"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    # Vendored/mounted plugin trees are byte-preserved fixtures, not source:
    # reformatting them would mutate the plugin-under-test. Every vendoring
    # location must be listed here or CI re-breaks (3rd occurrence).
    "tasks/*/plugins",
    "scenarios/*/assets",
    "scenarios/*-assets",
    # Generated task fixtures are the MATERIAL of an experiment, not source: the
    # buggy sources are shaped deliberately and the stashed originals must stay
    # byte-identical to them for the inverse-edit proxy to work. A reformat would
    # mutate the dataset without a dataset_version bump. The generator and its spec
    # tables (tasks/verif-lift-authoring/) are source and stay linted.
    "tasks/verif-lift-*-v1",
    # A sha256-pinned copy of the gate a bank scores with. Reformatting it would move the
    # ruler the run is measured against, and the pin assertion would (correctly) refuse to run.
    "tasks/*/_oracle",
]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
