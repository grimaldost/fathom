# Synthetic arm for the engine's own scenario tests.
name = "bare"
adapter = "claude-cli"
model = "claude-opus-4-8"
strategy = "single-session"
effort = "high"

[tools]
source = "none"
# Under headless default-deny an empty list means no tools at all.
allowed = ["Read", "Write", "Edit", "Glob", "Grep", "Bash(python:*)"]

[limits]
trial_timeout_s = 600
