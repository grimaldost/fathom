name: tag-watch

# The one release artifact no test can see. The version-sites reconciliation holds
# pyproject.toml, .claude-plugin/plugin.json and the newest CHANGELOG heading to each
# other, so a half-done bump fails the suite. Nothing held the tag, and the tag is what
# `git show vX.Y.Z` and `git log vX.Y.Z..HEAD` answer from, and what a data repository
# pins its fathom dependency to. An untagged version leaves "what was released"
# unanswerable, and uninstallable by tag, while every gate stays green.
#
# Every released version, not just the current one. Checking only the version
# pyproject names today would let a release superseded before the next scheduled run
# go unwatched forever. A watch that only ever asks about the newest release cannot
# see the one thing it watches for.
#
# Versions below a floor are skipped. A "Tags start at X.Y.Z" line in the CHANGELOG
# preamble sets it: this repository's history, and its tags, start at 0.8.0. Without that
# line every "## [X.Y.Z]" heading is checked.
#
# Scheduled rather than push-triggered, deliberately. The release commit lands first
# and is tagged immediately afterwards (CONTRIBUTING, "Releasing"), so a push gate
# would fail every release by construction and leave that commit permanently red even
# once tagged. An alarm that is wrong at first is an alarm people learn to ignore. A
# scheduled run re-evaluates, so the alarm clears by itself the next morning;
# workflow_dispatch clears it immediately.

# Least privilege: the check reads the checkout and its tags.
permissions:
  contents: read

on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:

jobs:
  tagged:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main
          fetch-depth: 0 # full history, so the tags come with it
      - name: every released version is tagged
        # One Python step instead of a shell pipeline: nothing here can pass because
        # an interpreter was missing or a pipe swallowed an exit status.
        run: |
          python3 - <<'PY'
          import pathlib, re, subprocess, sys

          # (changelog, tag prefix) pairs. This repository has one CHANGELOG and tags "vX.Y.Z".
          TARGETS = [(pathlib.Path("CHANGELOG.md"), "v")]

          def released(path):
              text = path.read_text(encoding="utf-8")
              first = re.search(r"^## \[", text, re.M)
              preamble = text[: first.start()] if first else text
              cut = re.search(r"Tags start at (\d+)\.(\d+)\.(\d+)", preamble)
              floor = tuple(map(int, cut.groups())) if cut else (0, 0, 0)
              found = [tuple(map(int, v)) for v in re.findall(r"^## \[(\d+)\.(\d+)\.(\d+)\]", text, re.M)]
              return found, [v for v in found if v >= floor]

          def tagged(name):
              probe = ["git", "rev-parse", "-q", "--verify", f"refs/tags/{name}"]
              return subprocess.run(probe, capture_output=True).returncode == 0

          missing, checked = [], 0
          for path, prefix in TARGETS:
              found, due = released(path)
              if not found:
                  # A CHANGELOG with no parseable version is a changed format, not a clean bill.
                  print(f"::error::{path} has no '## [X.Y.Z]' heading this check can read.")
                  sys.exit(1)
              for version in due:
                  name = prefix + ".".join(map(str, version))
                  checked += 1
                  if not tagged(name):
                      missing.append(name)

          if missing:
              print("::error::Released versions with no tag: " + ", ".join(missing) + ". Tag the release PR's merge commit: git tag -a vX.Y.Z <merge-commit> -m 'fathom X.Y.Z' && git push origin vX.Y.Z")
              sys.exit(1)
          print(f"{checked} released version(s) checked, all tagged.")
          PY
