name: ci

on:
  push:
  pull_request:

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
      # First, before sync: no test can guard lock staleness, because `uv run` re-locks
      # before pytest could read the file — only a pre-sync --check sees it.
      - run: uv lock --check
      - run: uv sync
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pytest

  changelog-currency:
    # Record the change or declare the exemption, machine-enforced (ported from keel's
    # changelog-currency job): the 0.4.0 cut shipped with two of the day's commits
    # unrecorded while the rule was prose. PR-only — the base ref is what makes the diff
    # meaningful. Version-site agreement is the reconcile registry's job (version-sites),
    # which pytest runs on every leg.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the merge-base with the target branch has to exist locally
      # Bare `python` is deliberate: the script is stdlib-only, and ubuntu-latest ships a
      # python3 symlinked as python — a setup step would buy nothing but latency.
      - run: |
          git log --format=%B "origin/${{ github.base_ref }}..HEAD" > "$RUNNER_TEMP/messages.txt"
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
            | python tools/changelog_currency.py --messages "$RUNNER_TEMP/messages.txt"
