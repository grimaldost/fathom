name: ci

on:
  push:
  pull_request:

# Every job only checks out the tree and runs local tooling; nothing calls a write API, so
# the workflow token is read-only.
permissions:
  contents: read

jobs:
  # NAME THIS ANYTHING BUT `gate`. The branch ruleset on the default branch requires a
  # status check whose context is exactly `gate`, and GitHub matches that name literally.
  # A matrix job never reports under its bare name — it reports one context per leg,
  # `gate (ubuntu-latest)` and `gate (windows-latest)` — so putting the matrix on `gate`
  # itself means the required context never arrives: it does not fail, it simply never
  # appears, and every PR sits MERGEABLE/BLOCKED forever behind a green checks list.
  # The `gate` job below is the aggregator that keeps that contract while the legs vary.
  gate-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: '3.12'
      # First, before sync: no test can guard lock staleness, because `uv run` re-locks
      # before pytest could read the file — only a pre-sync --check sees it.
      - run: uv lock --check
      - run: uv sync
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pytest
      # The MCP server's tests import fastmcp, which the core does not depend on, so the
      # run above does not collect them (pytest's testpaths is tests/). They check each
      # tool's parameter schema and that each tool runs the plugin's engine against the data
      # root. fastmcp is added for this step alone; the project environment is left as it is.
      - run: uv run --with "fastmcp>=2.0" --with pytest python -m pytest mcp/test_server_schema.py
      # `fathom reconcile` in the engine checkout, with no data root named or found: the
      # checkout carries no ledgers, so here it holds the version sites to each other.
      # Each step that relies on no data root being named, or on finding one from the
      # working directory, sets FATHOM_HOME to empty, which fathom reads as unset: a
      # FATHOM_HOME reaching the runner's environment would otherwise make the step check
      # that data root instead, and it could pass without checking what it names. --home
      # wins over FATHOM_HOME, so the steps that name a data root need nothing.
      - run: uv run fathom reconcile
        env:
          FATHOM_HOME: ""
      # The example data root, reached the three ways a user reaches theirs: named with
      # --home, named with FATHOM_HOME, and found from inside it with the engine as the
      # project. The fixture is a small synthetic data root.
      - run: uv run fathom --home examples/data-root reconcile
      - run: uv run fathom reconcile
        env:
          FATHOM_HOME: examples/data-root
      - run: uv run --project ../.. fathom reconcile
        working-directory: examples/data-root
        env:
          FATHOM_HOME: ""
      # The steps above import the editable tree, so a file the wheel leaves out passes them
      # and is missing from every installed copy (the smoke canary is package data). A user
      # installs fathom from a git tag, which uv builds into a wheel; so build the wheel, and
      # run it in a throwaway environment that holds that wheel alone: from inside the
      # example data root, and from a directory outside it with --home. `shell: bash` so the
      # glob expands on Windows too.
      - run: uv build --wheel -o dist
      - name: Run the installed wheel against the example data root
        shell: bash
        working-directory: examples/data-root
        # The reconcile below finds the data root from inside it (see above).
        env:
          FATHOM_HOME: ""
        run: |
          wheel=$(ls ../../dist/fathom-*.whl)
          # --isolated keeps the checkout's editable install out of the environment, so an
          # empty or broken wheel cannot pass on the source tree's behalf.
          uv run --isolated --no-project --with "$wheel" python -c "import fathom, pathlib; assert 'site-packages' in pathlib.Path(fathom.__file__).parts, fathom.__file__"
          uv run --isolated --no-project --with "$wheel" fathom --version
          uv run --isolated --no-project --with "$wheel" fathom reconcile
          uv run --isolated --no-project --with "$wheel" python -c "from fathom import smoke; assert (smoke.CANARY_PLUGIN_DIR / '.claude-plugin' / 'plugin.json').is_file()"
          # From outside the data root, naming it with --home. The paths stay relative so
          # they mean the same to bash and to uv on every runner.
          mkdir -p ../../build/elsewhere
          cd ../../build/elsewhere
          uv run --isolated --no-project --with "../../dist/$(basename "$wheel")" fathom --home ../../examples/data-root reconcile
          uv run --isolated --no-project --with "../../dist/$(basename "$wheel")" fathom --home ../../examples/data-root run example --dry-run

  # The single context the ruleset requires. It exists so the matrix can grow, shrink or
  # change OS without anyone remembering to edit a repository setting — the branch rule
  # keeps pointing at `gate`, and `gate` keeps meaning "every leg passed".
  #
  # `if: always()` is what makes it a gate rather than a formality: without it this job
  # would be SKIPPED when a leg fails, and a skipped required check reads as neutral, so
  # a red matrix would merge. With it the job runs regardless, and the step fails on any
  # result that is not success — including `cancelled` and `skipped`.
  gate:
    needs: gate-matrix
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every gate-matrix leg must have succeeded
        # The result arrives as an environment variable rather than as a `${{ }}`
        # expansion inside the script. An expansion is substituted into the script TEXT
        # before bash parses it, so the line's safety depends on what the value contains;
        # an env var is data whatever it contains. This value is one of four words GitHub
        # chooses, so nothing is exploitable here - the point is that the shape stops
        # being one an audit has to judge.
        env:
          GATE_RESULT: ${{ needs.gate-matrix.result }}
        run: |
          echo "gate-matrix result: $GATE_RESULT"
          test "$GATE_RESULT" = "success"

  changelog-currency:
    # Record the change or declare the exemption, machine-enforced: while the rule is only
    # prose, a release can ship with changes the changelog does not record. PR-only — the
    # base ref is what makes the diff meaningful. Version-site agreement is the reconcile registry's job (version-sites),
    # which every gate-matrix leg runs, in pytest and as `fathom reconcile`.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the merge-base with the target branch has to exist locally
          persist-credentials: false
      # Bare `python` is deliberate: the script is stdlib-only, and ubuntu-latest ships a
      # python3 symlinked as python — a setup step would buy nothing but latency.
      - run: |
          git log --format=%B "origin/$BASE_REF..HEAD" > "$RUNNER_TEMP/messages.txt"
          git diff --name-only "origin/$BASE_REF...HEAD" \
            | python tools/changelog_currency.py --messages "$RUNNER_TEMP/messages.txt"
        env:
          BASE_REF: ${{ github.base_ref }}

  zizmor:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uvx zizmor==1.30.0 --min-severity high .github/workflows
        env:
          GH_TOKEN: ${{ github.token }}
