# experiment-rigor record — multiagent dispatch + convoy's standalone gate vs multiagent alone.
# Source of truth; report.md is derived by render.py. The frozen subset (design.cells,
# outcomes' role/operationalization/verifier hash, analysis_plan) is committed BEFORE it is
# analyzed and reconciled by validate.py against plan_frozen_at.commit. Prose pre-registration:
# docs/specs/2026-09-01-multiagent-composition-preregistration.md (the 2026-09-02 addenda).
schema_version: 1
tier: measurement
experiment: multiagent-composition-v2
design:
  shared_tasks: true
  cells:
  - name: control-haiku
    planned_n: 16
  - name: placebo-haiku
    planned_n: 16
  - name: perpr-haiku
    planned_n: 16
  - name: final-haiku
    planned_n: 16
  - name: control-sonnet
    planned_n: 16
  - name: placebo-sonnet
    planned_n: 16
  - name: perpr-sonnet
    planned_n: 16
  - name: final-sonnet
    planned_n: 16
outcomes:
- name: held_out_clean
  role: confirmatory
  operationalization: a trial passes iff all six held_out criteria in verify.py are true —
    type_bool_arith_heldout, type_compare_heldout, env_bool_typing, not_precedence_heldout,
    error_type_is_typemismatch, short_circuit_heldout — graded by the deterministic verifier on
    the executed workspace, blind to arm. None of the six is asserted by any gate check or by
    the probe (disjointness asserted by tests/test_multiagent_bank.py).
  verifier:
    path: tasks/multiagent-composition-v2/exprlang/verify.py
    hash: 78d0e86ddeead4fa3da1188d9bd34550590a0fda892dc607891f7853cd8fe241
- name: held_out_clean_independent
  role: exploratory
  operationalization: sensitivity endpoint (pre-registration addendum no. 4) — the conjunction of
    the four held_out criteria the probes' type rule does not touch (env_bool_typing,
    not_precedence_heldout, error_type_is_typemismatch, short_circuit_heldout). Reported beside
    the primary with the same contrasts; not in the Holm family.
  verifier:
    path: tasks/multiagent-composition-v2/exprlang/verify.py
    hash: 78d0e86ddeead4fa3da1188d9bd34550590a0fda892dc607891f7853cd8fe241
- name: full15_clean
  role: exploratory
  operationalization: a trial passes iff all fifteen original ablation-v2 criteria are true —
    the project-visible surface the implementer's own suite approximates.
  verifier:
    path: tasks/multiagent-composition-v2/exprlang/verify.py
    hash: 78d0e86ddeead4fa3da1188d9bd34550590a0fda892dc607891f7853cd8fe241
analysis_plan:
  ci_method: wilson
  comparison: four pre-registered one-sided contrasts (treatment > control) per implementer
    tier-set, Holm-corrected within the tier-set's family of four at alpha 0.05 — (1) perpr vs
    control, (2) perpr vs placebo [decisive; separates independent information from the extra
    iteration], (3) final vs control, (4) final vs placebo — Fisher exact on held_out_clean
    counts; Wilson 95% on every cell; tier-sets never pooled.
  decision_rule:
    metric: rate_difference
    comparison: gt
    threshold: 0.0
    direction: higher
  prior_data_collected: yes — the v1 pilot (bank multiagent-composition, 24 trials, all cells at
    ceiling) and the v2 pilot (24 trials, the first 3 repeats of these 8 cells, block-ordered,
    pooled into n=16 as the run loop resumes them; declared in the 2026-09-02 addendum before the
    main matrix's first trial).
  question_hypothesis: does a Sonnet orchestrator dispatching one implementer subagent per PR
    produce more held-out-clean work when it runs convoy's standalone gate between PRs
    (fail-closed independent checks + repair_brief) than when it verifies with the project's
    own suite alone — and is the gain the independent information (perpr > placebo), not the
    extra iteration (placebo ≈ control)? Convoy's orchestration appears in no arm.
  dv_operationalization: held_out_clean as above; secondary full15_clean; mechanism —
    first-gate red rate and fix-dispatch count per arm (from ledger detail and transcripts);
    cost per trial (sum of run rows per config_hash+repeat) and wall-clock.
  conditions_factors: arm x implementer tier. Arms — control (visible suite only), placebo
    (control + a ceremony gate that reddens exactly once per workspace with no information),
    perpr (control + `run_convoy_gate.py --phase <pr>` after each PR, fix subagent briefed with
    the envelope's repair_brief on blocked), final (control's brief; the harness runs the driver
    once after the session with a bounded fix loop). Tier — implementer subagents at
    claude-haiku-4-5 or claude-sonnet-5 via FATHOM_IMPL_MODEL; orchestrator Sonnet 5 effort
    high in every arm; tools, limits and env keys byte-identical across arms; briefs differ in
    one contiguous block (asserted by test). Convoy under test — 0.11.0, pinned by git tag via
    uvx, provenance echoed per call.
  exclusion_rules: none. Every launched trial is dispositioned; an infrastructure stop
    (seat authentication failure) halts the matrix without writing the failing trial, which is
    resumed, not excluded. Reported as excluded if any row is dropped.
  n_and_rationale: 16 per cell. The exact power calculation (one-sided Fisher, alpha 0.0125 =
    Holm's strictest step, Laplace-shrunk pilot rates 0.875 vs 0.375 for perpr vs placebo) asks
    20 for power 0.80; the remaining iteration budget ($286.52 of $400) buys 13 further repeat
    passes at $19.15/pass, so n=16 is budget-bound with exact power 0.69 on the decisive
    contrast and 0.99 on perpr vs control, declared before the first main trial. A
    non-significant decisive contrast at n=16 is reported as underpowered at the achieved n,
    not as a null.
  other: main-matrix trials run as repeat passes (--repeats k, k=4..16), each pass covering
    every arm once — arm-interleaved by pass (the run loop's order is scenario > task > repeat,
    so a plain run would block arms; the pilot's 24 were blocked and are disclosed as such).
    Caps $20 per spawn, $275 per run. Seat lifetime ~4h — the pass script stops on
    authentication failure and the same command resumes.
threats:
  contamination_familiarity:
    status: residual
    statement: exprlang is a synthetic package but the bool-subclasses-int trap is a well-known
      Python idiom the models may carry from pretraining; no arm primes another (fresh
      workspace per trial, prompts-only visibility via FATHOM_PROMPTS_DIR).
  prompt_format_sensitivity:
    status: controlled
    statement: one task statement and five PR prompts byte-identical across arms; the injected
      briefs differ in exactly one contiguous block (asserted by tests/test_multiagent_bank_v2.py);
      tools, limits and env keys identical.
  judge_bias:
    status: controlled
    statement: deterministic verifier on the executed workspace, blind to arm; no LLM judge;
      the primary criteria are disjoint from every gate assertion as literal strings and after
      stripping whitespace/parentheses.
  model_version_drift:
    status: residual
    statement: haiku implementer snapshot attested from transcripts (claude-haiku-4-5-20251001);
      the Sonnet orchestrator and Sonnet implementers carry only the undated alias in transcripts
      and the ledger records no cli_version or model snapshot; the matrix spans ~20h of
      wall-clock across seat re-logins, and the pilot's 24 were arm-blocked.
  nondeterminism:
    status: controlled
    statement: 16 independent trials per cell, temperature as the CLI default, Wilson intervals
      on every cell rate; the decisive contrast's exact power at n=16 is declared (0.69).
  construct_validity_proxy:
    status: residual
    statement: held_out_clean stands for "the work is correct on what the gate did not assert";
      it is one task shape (a 5-PR feature in a 4-module toy package) and the claim is about
      convoy's gate under external orchestration, not about convoy's runner.
  token_length_confound:
    status: residual
    statement: the treatment brief is longer than control's by its gate block and the
      treatment arms spend more turns (per-trial cost +20% to +48%, wall-clock +25% to +50% in
      the pilot); the placebo arm carries a comparable ceremony block and is the length/iteration
      control, but no equal-length no-information brief beyond it was run.
  selection_exclusion:
    status: controlled
    statement: no exclusion rule; every launched trial is in the disposition; an infrastructure
      stop leaves the failing trial unwritten and resumed, never dropped.
  generalization:
    status: residual
    statement: one bank, one task family, two implementer tiers, one orchestrator model, one
      convoy version; the v1 pilot showed the effect vanishes when the PR prompts spell out the
      rule, so the claim is scoped to briefs that leave the implementer something to infer.
